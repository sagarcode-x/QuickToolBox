<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator - QuickToolBox</title>

    <meta name="description"
        content="Generate QR codes online for free with QuickToolBox.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>

        <div class="container">

            <div class="logo">
                QuickToolBox
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="index.html#tools">Tools</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>

        </div>

    </header>


    <!-- QR Generator -->
    <main class="tool-page">

        <div class="container">

            <h1>QR Code Generator</h1>

            <p class="tool-description">
                Enter text or a website URL to generate a QR code.
            </p>


            <div class="qr-card">

                <h2>Create Your QR Code</h2>

                <input
                    type="text"
                    id="qrText"
                    placeholder="Enter text or website URL"
                >

                <button id="generateQR">
                    Generate QR Code
                </button>


                <div id="qrResult" class="qr-result"></div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="container">

            <p>
                © 2026 QuickToolBox. All rights reserved.
            </p>

            <div class="footer-links">

                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>

                <a href="privacy.html">Privacy Policy</a>

                <a href="terms.html">Terms</a>

            </div>

        </div>

    </footer>


    <script src="qr-generator.js"></script>

</body>

</html>
