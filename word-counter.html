<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Free online word counter. Count words, characters, sentences and reading time.">

    <title>Word Counter - QuickToolBox</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->

    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                QuickToolBox
            </a>

            <nav>

                <a href="index.html">Home</a>

                <a href="index.html#tools">Tools</a>

                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>

            </nav>

        </div>

    </header>


    <!-- Word Counter -->

    <main class="tool-page">

        <div class="container">

            <h1>Free Word Counter</h1>

            <p class="tool-description">
                Count words, characters, sentences and
                reading time instantly.
            </p>


            <!-- Text Area -->

            <textarea
                id="textInput"
                placeholder="Type or paste your text here..."
                rows="12">
            </textarea>


            <!-- Statistics -->

            <div class="counter-results">

                <div class="result-box">

                    <h3>Words</h3>

                    <p id="wordCount">0</p>

                </div>


                <div class="result-box">

                    <h3>Characters</h3>

                    <p id="characterCount">0</p>

                </div>


                <div class="result-box">

                    <h3>Sentences</h3>

                    <p id="sentenceCount">0</p>

                </div>


                <div class="result-box">

                    <h3>Reading Time</h3>

                    <p id="readingTime">0 min</p>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer class="footer">

        <div class="container">

            <p>
                © 2026 QuickToolBox. All rights reserved.
            </p>

            <div class="footer-links">

                <a href="about.html">About</a>

                <a href="contact.html">Contact</a>

                <a href="privacy.html">Privacy Policy</a>

                <a href="terms.html">Terms</a>

            </div>

        </div>

    </footer>


    <!-- JavaScript -->

    <script src="word-counter.js"></script>

</body>

</html>
